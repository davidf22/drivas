# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name drivas.online www.drivas.online;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.drivas.online$request_uri;
    }
}

# HTTPS — main app
server {
    listen 443 ssl;
    server_name drivas.online www.drivas.online;

    ssl_certificate     /etc/letsencrypt/live/drivas.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drivas.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    # Media files (licence images, profile photos)
    location /media/ {
        alias /app/media/;
    }

    # Everything else → gunicorn
    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
