<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drivas — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,.1);
    }
    .logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .logo {
      width: 44px; height: 44px;
      background: #e94560;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 20px; color: #fff;
    }
    .logo-row h1 { font-size: 22px; font-weight: 700; color: #1a1a2e; }
    .logo-row p  { font-size: 12px; color: #888; margin-top: 2px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 18px;
      font-family: inherit;
    }
    input:focus { border-color: #e94560; }
    .btn {
      width: 100%;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .btn:hover { background: #c73652; }
    .errors {
      background: #fff0f2;
      border: 1px solid #f5c6cc;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #c0392b;
      margin-bottom: 18px;
    }
    .hint {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
      text-align: center;
      line-height: 1.6;
    }
    .hint a { color: #e94560; text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <div class="logo">D</div>
    <div>
      <h1>Drivas</h1>
      <p>Driver Employment Platform</p>
    </div>
  </div>

  {% if form.errors %}
  <div class="errors">Invalid username or password. Please try again.</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <label for="id_username">Username</label>
    <input type="text" id="id_username" name="username" autofocus autocomplete="username" />
    <label for="id_password">Password</label>
    <input type="password" id="id_password" name="password" autocomplete="current-password" />
    <input type="hidden" name="next" value="{{ request.GET.next|default:'/chat/' }}" />
    <button type="submit" class="btn">Sign In</button>
  </form>

  <p class="hint">
    Don't have an account? <a href="/chat/">Chat with our assistant</a> to register.
  </p>
</div>
</body>
</html>
